# /etc/nginx/sites-available/cers.exnulla.com
# CERS thin portal — proxies to Node.js on 127.0.0.1:3001
# If 3001 is taken by orbital, change upstream port to 3002 and update cers-portal.service PORT.

server {
    listen 80;
    server_name cers.exnulla.com;

    # Redirect to HTTPS once cert is in place
    # return 301 https://$host$request_uri;

    # Upload size limit — match spec §13.5 100 MiB per file
    client_max_body_size 110m;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Security headers
        add_header X-Content-Type-Options  nosniff always;
        add_header X-Frame-Options         SAMEORIGIN always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        # No Cache-Control on API paths — set per-route in the Node server
    }

    # Static assets get aggressive caching after fingerprinting is added
    location ~* \.(ico|png|jpg|woff2?)$ {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "public, max-age=86400";
    }

    access_log  /var/log/nginx/cers.access.log;
    error_log   /var/log/nginx/cers.error.log;
}

